services:
  spark-iceberg:
    image: tabulario/spark-iceberg
    container_name: spark-iceberg
    build: spark/
    networks:
      iceberg_net:
    depends_on:
      rest:
        condition: service_started
      rustfs:
        condition: service_started
      storage-init:
        condition: service_completed_successfully
    volumes:
      - ./warehouse:/home/iceberg/warehouse
      - ./notebooks:/home/iceberg/notebooks/notebooks
      - ./parquet_data:/parquet_data
      # Used by init.sh: data, the CSV-to-Parquet converter, the table definitions, and
      # Spark defaults that point Iceberg's S3 client at RustFS.
      - ./csv_data:/csv_data:ro
      - ./CsvToParquet.py:/home/iceberg/CsvToParquet.py:ro
      - ./init.sql:/home/iceberg/init.sql:ro
      - ./conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
    environment:
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password
      - AWS_REGION=us-east-1
    ports:
      - 8888:8888
      - 8180:8080
      - 10000:10000
      - 10001:10001
  rest:
    image: tabulario/iceberg-rest
    container_name: iceberg-rest
    networks:
      iceberg_net:
    ports:
      - 8181:8181
    environment:
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password
      - AWS_REGION=us-east-1
      - CATALOG_WAREHOUSE=s3://warehouse/
      - CATALOG_IO__IMPL=org.apache.iceberg.aws.s3.S3FileIO
      - CATALOG_S3_ENDPOINT=http://rustfs:9000
      - CATALOG_S3_PATH__STYLE__ACCESS=true
  # RustFS instead of MinIO: MinIO's Docker Hub images are no longer anonymously
  # pullable (the registry issues a token, then denies the manifest). RustFS is
  # S3-compatible, exposes the same 9000/9001, and takes the same credentials.
  rustfs:
    image: rustfs/rustfs:latest
    container_name: rustfs
    environment:
      - RUSTFS_ACCESS_KEY=admin
      - RUSTFS_SECRET_KEY=password
      - RUSTFS_VOLUMES=/data
    volumes:
      - warehouse-data:/data
    networks:
      iceberg_net:
        # kept so existing catalog configs that point at http://minio:9000 resolve
        aliases:
          - minio
          - warehouse.minio
    ports:
      - 9001:9001
      - 9000:9000
  # Creates the warehouse bucket. RustFS does not treat a directory under the data
  # volume as a bucket, so this has to go through the S3 API rather than mkdir.
  storage-init:
    image: amazon/aws-cli:latest
    container_name: storage-init
    depends_on:
      - rustfs
    environment:
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password
      - AWS_REGION=us-east-1
    entrypoint: >
      /bin/sh -c "
      until aws --endpoint-url http://rustfs:9000 s3 ls >/dev/null 2>&1; do echo '...waiting for rustfs...'; sleep 2; done;
      aws --endpoint-url http://rustfs:9000 s3 mb s3://warehouse || true;
      aws --endpoint-url http://rustfs:9000 s3 ls
      "
    networks:
      iceberg_net:
  puppygraph:
    image: puppygraph/puppygraph:latest
    container_name: puppygraph
    networks:
      iceberg_net:
    environment:
      - PUPPYGRAPH_USERNAME=puppygraph
      - PUPPYGRAPH_PASSWORD=puppygraph123
    ports:
      - "8081:8081"
      - "8182:8182"
      - "7687:7687"
    depends_on:
      - spark-iceberg
networks:
  iceberg_net:
    name: puppy-iceberg

volumes:
  warehouse-data:
